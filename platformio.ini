; M5 StickC Motion Face - build with PlatformIO:  pio run -t upload
[env:m5stickc]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.2
; Uncomment if the eyes look the wrong way when you tilt the device:
; build_flags = -DLOOK_X_SIGN=-1.0f -DLOOK_Y_SIGN=1.0f
